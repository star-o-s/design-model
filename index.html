<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Design Models</title>
  <style>
    body {
      margin: 0;
      background: #f8f8f8;
      color: #fff;
      font-family: arial, sans-serif;
    }

    h1 {
      text-align: center;
      padding: 40px 0 10px;
      font-size: 2em;
      color: #666;
    }

    h2 {
      text-align: center;
      padding: 5px 0 40px;
      font-size: 1em;
      color: #666;
    }

    p {
      text-align: center;
      padding: 5px 0 45px;
      font-size: 1em;
      color: #666;
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 40px;
      max-width: 1200px; /* Ahora ocupa más ancho */
      margin: auto;
      padding: 20px;
      padding-bottom: 100px;
    }

    .imagen {
      width: 100%;
      opacity: 0;
      transform: translateY(80px) scale(0.95);
      transition: opacity 0.8s ease, transform 0.8s ease;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .imagen.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    @media (max-width: 768px) {
      .galeria {
        grid-template-columns: 1fr; /* Una columna en pantallas pequeñas */
      }
    }
  </style>
</head>
<body>

  <h1>Design Models</h1>
  <h2>By Yura Ulyanov</h2>

  <div class="galeria">
    <img src="model3.png" alt="Diseño 1" class="imagen">
    <img src="model15.png" alt="Diseño 2" class="imagen">
    <img src="model8.png" alt="Diseño 3" class="imagen">
    <img src="model16.png" alt="Diseño 4" class="imagen">
    <img src="model13.png" alt="Diseño 5" class="imagen">
    <img src="model14.png" alt="Diseño 6" class="imagen">
    <img src="model1.png" alt="Diseño 7" class="imagen">
    <img src="model10.png" alt="Diseño 8" class="imagen">
  </div>

  <p>Thanks, I hope you liked it.</p>

  <script>
    const images = document.querySelectorAll('.imagen');

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        } else {
          entry.target.classList.remove('visible');
        }
      });
    }, {
      root: null,
      threshold: 0.1,
      rootMargin: '0px 0px -10% 0px'
    });

    images.forEach(img => observer.observe(img));
  </script>

</body>
</html>
